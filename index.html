<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12384a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ส่งข่าว">
<title>ส่งข่าว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pri:#12384a;--acc:#ff7a1a;--bg:#f2f4f6;--card:#fff;--ink:#1b2a33;--mut:#74838d;--line:#e3e8eb;--ok:#1f9d55;--warn:#d9822b;--bad:#d64545;--nav:58px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--pri);overscroll-behavior:none}
body{font-family:'IBM Plex Sans Thai',system-ui,-apple-system,sans-serif;color:var(--ink);font-size:15px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
#sbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--pri);z-index:60}
#app{position:fixed;top:env(safe-area-inset-top);left:0;right:0;bottom:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
header{flex:none;background:var(--pri);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px}
header .t{flex:1;min-width:0}
header h1{margin:0;font-size:20px;font-weight:700;line-height:1.2}
header .s{font-size:12px;opacity:.75;margin-top:2px}
#rf{width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;color:#fff}
#rf svg{width:22px;height:22px}
#rf.spin svg{animation:sp 1s linear infinite}
body[data-tab=saved] #rf,body[data-tab=set] #rf,body[data-tab=re] #rf{visibility:hidden}
body[data-tab=chat] header{display:none}
@keyframes sp{to{transform:rotate(360deg)}}
#page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px}
body[data-tab=chat] #page{padding:0 12px 96px}
nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--line);height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut);font-size:11px;font-weight:500}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri);font-weight:700}
nav button.on svg{stroke:var(--acc)}
.n{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(18,56,74,.06);overflow:hidden}
.nh{display:flex;gap:12px;padding:13px 14px;width:100%;text-align:left;align-items:flex-start}
.rk{flex:none;width:26px;height:26px;border-radius:13px;background:var(--bg);color:var(--mut);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.rk.hot{background:var(--acc);color:#fff}
.nt{flex:1;min-width:0}
.lab{font-size:12px;color:var(--mut);font-weight:500}
.ttl{font-size:17px;font-weight:700;line-height:1.4;margin:1px 0 3px;color:var(--ink)}
.sub{font-size:12px;color:var(--mut)}
.sd{font-size:13px;color:var(--warn);font-weight:600;margin-bottom:3px}
.orig{font-size:12px;color:var(--mut);margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nb{padding:0 14px 14px 52px}
.lung{color:var(--ink);white-space:pre-line;font-size:15px;line-height:1.65;padding-top:10px;border-top:1px solid var(--line)}
.lh{font-size:12px;color:var(--mut);margin:10px 0 4px;padding-top:10px;border-top:1px solid var(--line)}
.lh+.lung{border-top:0;padding-top:0}
.facts{white-space:pre-line;font-size:14px;line-height:1.65;color:var(--ink)}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.note a{color:var(--mut)}
.load{color:var(--warn);font-weight:600;font-size:14px;padding:10px 0}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{height:38px;padding:0 14px;border-radius:19px;background:var(--bg);color:var(--pri);font-weight:600;font-size:14px}
.btn.pri{background:var(--pri);color:#fff}
.btn.acc{background:var(--acc);color:#fff}
.btn.on{background:#fff1e6;color:var(--acc)}
.btn:disabled{opacity:.5}
.pimg{width:100%;border-radius:12px;margin-top:10px;display:block}
.card{background:var(--card);border-radius:14px;margin-bottom:12px;overflow:hidden}
.pad{padding:14px}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label{flex:none;width:84px;font-weight:600;font-size:14px}
.row input{flex:1;min-width:0;border:0;outline:0;background:none;text-align:right;font-size:16px;padding:6px 0;color:var(--ink)}
.h2{font-size:17px;font-weight:700;margin:0 0 4px}
.hint{font-size:13px;color:var(--mut)}
.empty{text-align:center;padding:28px 18px}
.chead{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;display:flex;gap:8px;align-items:center}
.chip{flex:1;min-width:0;background:#fff;border-radius:18px;padding:7px 14px;font-size:13px;color:var(--pri);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.chip span{overflow:hidden;text-overflow:ellipsis}
.chip b{flex:none;color:var(--mut);font-size:16px;font-weight:500;padding:0 2px}
.cclr{flex:none;font-size:12px;color:var(--mut);padding:8px 4px}
.b{max-width:88%;padding:10px 14px;border-radius:16px;margin:8px 0;font-size:15px;line-height:1.6;word-break:break-word}
.b.u{margin-left:auto;background:var(--pri);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.b.a{background:#fff;color:var(--ink);border-bottom-left-radius:4px}
.ch-ai{white-space:pre-line}
.b.err{background:#fdecec;color:var(--bad);font-size:13px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sugg button{background:#fff;border-radius:18px;padding:8px 14px;font-size:14px;color:var(--pri);font-weight:500}
#comp{display:none;position:fixed;left:0;right:0;bottom:calc(var(--nav) + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);padding:8px 10px;gap:8px;align-items:flex-end;z-index:30}
body[data-tab=chat] #comp{display:flex}
#msg{flex:1;min-width:0;resize:none;border:0;outline:0;background:var(--bg);border-radius:18px;padding:9px 14px;font-size:16px;line-height:1.4;max-height:110px}
#snd{flex:none;height:40px;padding:0 18px;border-radius:20px;background:var(--acc);color:#fff;font-weight:700}
#snd:disabled{opacity:.5}
.cats{position:sticky;top:0;z-index:5;background:var(--bg);margin:-12px -12px 10px;padding:10px 12px 8px;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;height:34px;padding:0 14px;border-radius:17px;background:#fff;color:var(--pri);font-weight:600;font-size:14px;white-space:nowrap}
.cat.on{background:var(--pri);color:#fff}
.cat i{font-style:normal;opacity:.65;font-size:12px;margin-left:4px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px);background:rgba(27,42,51,.94);color:#fff;font-size:13px;padding:10px 14px;border-radius:12px;z-index:40;display:none;text-align:center}
body[data-tab=chat] #toast{bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 70px)}
</style>
</head>
<body data-tab="news">
<div id="sbar"></div>
<div id="app">
  <header>
    <div class="t"><h1 id="ttl">ข่าวไทย</h1><div class="s" id="sub"></div></div>
    <button id="rf" aria-label="รีเฟรช"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"/></svg></button>
  </header>
  <div id="page"></div>
  <nav>
    <button data-tab="news"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>ข่าว</button>
    <!-- แท็บอสังหาฯ พักไว้ก่อน (โค้ด tab "re" ยังอยู่ครบ เปิดกลับโดยเอา comment ออก)
    <button data-tab="re"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>อสังหาฯ</button>
    -->
    <button data-tab="saved"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>เก็บไว้</button>
    <button data-tab="chat"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>แชท</button>
    <button data-tab="set"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>ตั้งค่า</button>
  </nav>
</div>
<div id="comp"><textarea id="msg" rows="1" placeholder="ถามลุงเรื่องข่าว…"></textarea><button id="snd">ส่ง</button></div>
<div id="toast"></div>
<script>
(function(){
'use strict';
var VERSION='7.4 · 2026-11-10';
var DEFAULT_URL='';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var LS={
  get:function(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var TABS={news:'ข่าว',re:'อสังหาฯ (กลุ่ม)',saved:'เก็บไว้',chat:'แชท',set:'ตั้งค่า'};
var S={
  tab:LS.get('sk_tab','news'),
  cat:LS.get('sk_cat','th'),
  news:LS.get('sk_news',{near:[],th:[],world:[],at:0}),
  re:LS.get('sk_re',[]), // เก็บข้อมูลอสังหาฯ
  reUrl:LS.get('sk_reUrl',''), // เก็บ URL กลุ่มล่าสุด
  pg:LS.get('sk_pg',[]), // โพสต์ล่าสุดจากเพจ
  pgUrl:LS.get('sk_pgUrl',''),pgLoading:false,
  saved:LS.get('sk_saved',[]),
  chat:LS.get('sk_chat',[]),
  ctx:null,tst:{t:'',c:''},busy:0,open:{},retelling:{},posting:{},post:LS.get('sk_post',{}),loading:false,sending:false,chatErr:'',wipeArm:false,reLoading:false,delArm:'',vidOpen:{},vgreen:LS.get('sk_vgreen',true),
  vchar:LS.get('sk_vchar',''),csafe:LS.get('sk_csafe',{}),safing:{}
};
// หมวดในแท็บข่าว (เลื่อนซ้ายขวาได้)
var CATS=[['th','ดราม่าไทย'],['alert','เตือนภัย'],['welfare','สวัสดิการ'],['econ','เศรษฐกิจ'],['protest','ชุมนุม'],['ent','บันเทิง'],['world','ต่างประเทศ'],['page','จากเพจ']];
var CATL={};CATS.forEach(function(c){CATL[c[0]]=c[1]});
var NEAR_C={alert:1,welfare:1,econ:1,protest:1,ent:1};
if(S.tab==='th'||S.tab==='world'||S.tab==='near'){S.cat=S.tab==='near'?'alert':S.tab;S.tab='news'}
if(!TABS[S.tab]||S.tab==='chat'||S.tab==='re')S.tab='news';
if(!CATL[S.cat])S.cat='th';
if(!S.news.near)S.news.near=[];
function catOf(it){var t=String(it.tag||'');if(NEAR_C[t])return t;if(/สิทธิ|สปสช/.test(t))return 'welfare';return 'alert'}
function catList(c){
  if(c==='th'||c==='world')return S.news[c]||[];
  if(c==='page')return S.pg;
  return S.news.near.filter(function(x){return catOf(x)===c});
}

function cfg(){var c=LS.get('sk_cfg',{});return {url:c.url||DEFAULT_URL,key:c.key||''}}
function ago(ts){
  var m=Math.round((Date.now()-ts)/60000);
  if(m<1)return 'เมื่อกี้';
  if(m<60)return m+' นาทีที่แล้ว';
  var h=Math.round(m/60);
  if(h<24)return h+' ชม.ที่แล้ว';
  return Math.round(h/24)+' วันที่แล้ว';
}
function hhmm(ts){var d=new Date(ts);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function toast(t){var el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){el.style.display='none'},3500)}

// ---------- API ----------
async function api(fn,args,ms){
  var c=cfg();
  if(!c.url||!c.key)throw new Error('ยังไม่ได้ตั้ง API ไปที่แท็บตั้งค่า');
  S.busy++;
  var ac=new AbortController();
  var to=setTimeout(function(){ac.abort()},ms||60000);
  try{
    var r=await fetch(c.url,{method:'POST',body:JSON.stringify({fn:fn,args:args||[],k:c.key}),headers:{'Content-Type':'text/plain;charset=utf-8'},signal:ac.signal,redirect:'follow'});
    var j=await r.json();
    if(!j.ok)throw new Error(j.error||'ผิดพลาด');
    return j.result;
  }catch(e){
    if(e&&e.name==='AbortError')throw new Error('รอนานเกินไป ลองใหม่อีกครั้ง');
    if(e instanceof TypeError)throw new Error('เน็ตมีปัญหา ลองใหม่อีกครั้ง');
    throw e;
  }finally{clearTimeout(to);S.busy--}
}

// ---------- ข้อมูล ----------
function find(id){
  var all=S.news.near.concat(S.news.th,S.news.world,S.saved,S.re,S.pg);
  for(var i=0;i<all.length;i++)if(all[i].id===id)return all[i];
  return null;
}
function isSaved(id){return S.saved.some(function(x){return x.id===id})}
function setLung(id,t){
  [S.news.near,S.news.th,S.news.world,S.saved,S.re].forEach(function(l){l.forEach(function(x){if(x.id===id)x.lung=t})});
  LS.set('sk_news',S.news);LS.set('sk_saved',S.saved);LS.set('sk_re',S.re);
}
async function loadNews(){
  if(S.loading)return;
  var c=cfg();
  if(!c.url||!c.key){render(true);return}
  S.loading=true;$('#rf').classList.add('spin');
  try{
    var r=await Promise.all([api('list',['th',40]),api('list',['world',40]),api('list',['near',80]).catch(function(){return S.news.near})]);
    S.news={th:r[0],world:r[1],near:r[2],at:Date.now()};
    LS.set('sk_news',S.news);
    S.saved.forEach(function(s){var f=find(s.id);if(f&&f!==s&&f.lung)s.lung=f.lung});
    LS.set('sk_saved',S.saved);
  }catch(e){toast('โหลดไม่ได้: '+e.message+' (แสดงข่าวที่เก็บไว้)')}
  S.loading=false;$('#rf').classList.remove('spin');render(true);
}
async function loadPage(){
  var u=$('#pgUrl')?$('#pgUrl').value.trim():S.pgUrl;
  if(!u){toast('ใส่ลิงก์เพจ Facebook ก่อน');return}
  if(!/facebook\.com\//.test(u)||/facebook\.com\/groups\//.test(u)){toast('ต้องเป็นลิงก์เพจ Facebook (ไม่ใช่กลุ่ม)');return}
  S.pgUrl=u;LS.set('sk_pgUrl',u);S.pgLoading=true;render(true);
  try{
    var res=await api('getPagePosts',[u],120000);
    if(res&&res.ok){S.pg=res.result;LS.set('sk_pg',S.pg);toast(res.result.length?'ดึงโพสต์ล่าสุดแล้ว '+res.result.length+' โพสต์':'ไม่พบโพสต์ใน 3 วันล่าสุด')}
    else toast('Error: '+((res&&res.error)||'ไม่ทราบสาเหตุ'));
  }catch(e){toast('ดึงข้อมูลไม่ได้: '+e.message)}
  S.pgLoading=false;render(true);
}
function pgHtml(){
  return '<div class="card pad"><div class="h2">โพสต์ล่าสุดจากเพจ Facebook</div><div class="hint" style="margin-bottom:10px">วางลิงก์เพจที่อยากตามหัวข้อ ดึงโพสต์ใหม่ภายใน 3 วัน (กินเครดิต Apify ทุกครั้งที่กด) ใช้ดูหัวข้อ แล้วให้ลุงเขียนใหม่ด้วยคำของเรา</div><input id="pgUrl" value="'+esc(S.pgUrl)+'" placeholder="https://facebook.com/ชื่อเพจ" autocapitalize="off" autocorrect="off" style="font-size:16px;padding:10px;border:1px solid #ccc;border-radius:8px;width:100%"><div style="margin-top:10px"><button class="btn pri" data-act="fetchPg" style="width:100%">'+(S.pgLoading?'กำลังดึงโพสต์...':'ดึงโพสต์ล่าสุด')+'</button></div></div>'+
    (S.pg.length?'<div class="hint" style="margin:0 4px 8px">โพสต์ล่าสุดจาก'+esc(S.pg[0].source||'เพจ')+' (ใหม่สุดอยู่บน)</div>'+S.pg.map(function(it,i){return itemHtml(it,i,false)}).join(''):'');
}
async function loadRealEstate(){
  var urlInput = $('#reUrl') ? $('#reUrl').value.trim() : S.reUrl;
  if(!urlInput) { toast('กรุณาใส่ URL กลุ่ม Facebook ก่อน'); return; }
  if(!urlInput.includes('facebook.com/groups/')) { toast('URL ต้องเป็นลิงก์กลุ่ม Facebook เท่านั้น'); return; }
  
  S.reUrl = urlInput; LS.set('sk_reUrl', urlInput);
  S.reLoading = true; render(true);
  
  try {
    var res = await api('getGroupRealEstate', [urlInput], 120000);
    if(res && res.ok) {
      S.re = res.result;
      LS.set('sk_re', S.re);
      toast('ดึงข้อมูลอสังหาฯ สำเร็จ');
    } else {
      toast('Error: ' + (res.error || 'ไม่ทราบสาเหตุ'));
    }
  } catch(e) { toast('ดึงข้อมูลไม่ได้: ' + e.message); }
  
  S.reLoading = false; render(true);
}

// ---------- วาด ----------
function itemHtml(it,i,hot){
  var op=!!S.open[it.id],b='';
  if(op){
    var fx=it.facts?'<div class="lh">ข่าวย่อ (สรุปจากแหล่งข่าว)</div><div class="facts">'+esc(it.facts)+'</div>':'';
    if(S.retelling[it.id])b+=fx+'<div class="load">ลุงกำลังค้นข่าวและเล่า…</div>';
    else if(it.lung)b+=fx+'<div class="lh">ลุงเล่า</div><div class="lung">'+esc(it.lung)+'</div>';
    else b+=fx+'<div class="note">ลุงยังไม่ได้เล่าข่าวนี้</div>';
    var link=/^https?:\/\//.test(it.url||'')?' · <a href="'+esc(it.url)+'" target="_blank" rel="noopener">อ่านต้นฉบับ</a>':'';
    if(S.posting[it.id])b+='<div class="load">ลุงกำลังเรียบเรียงโพสต์…</div>';
    else if(S.post[it.id]){var p=S.post[it.id];b+='<div class="lh">โพสต์ที่ลุงร่างให้</div><div class="lung">'+esc(postText(p))+'</div><img class="pimg" src="'+postImg(p)+'" alt="การ์ดภาพ"><div class="note">กดค้างที่ภาพเพื่อบันทึก</div>'}
    if(S.vidOpen[it.id]&&it.lung)b+=vidHtml(it);
    b+='<div class="note">ที่มา: '+esc(it.source||'-')+link+'</div><div class="acts">';
    
    if(it.tag === 'อสังหาฯ' || it.tag === 'เพจ') {
      b+='<a class="btn pri" href="'+esc(it.url)+'" target="_blank" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;">🔗 เปิดใน Facebook</a>';
    } else {

function clip(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
  return new Promise(function(res,rej){
    var ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:-9999px;top:0;font-size:16px';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')?res():rej()}catch(e){rej(e)}
    document.body.removeChild(ta);
  });
}
function postText(p){return p.hook+'\n\n'+p.body+'\n\n'+p.q+(p.src?'\n\nที่มา: '+p.src:'')+'\n\n'+p.tags.join(' ')}
var IMGC={};
function wrapTh(x,text,maxW){
  var segs=(window.Intl&&Intl.Segmenter)?Array.from(new Intl.Segmenter('th',{granularity:'word'}).segment(text),function(s){return s.segment}):text.split('');
  var lines=[],cur='';
  segs.forEach(function(s){var t=cur+s;if(x.measureText(t).width>maxW&&cur){lines.push(cur.trim());cur=s}else cur=t});
  if(cur.trim())lines.push(cur.trim());
  return lines;
}
// การ์ดข่าวใกล้ตัว: ป้ายแดง พาดหัวเหลืองตัวใหญ่ สรุป 3 ข้อสีขาว + ที่มา
function postImgNearOld(p){
  var W=1080,c=document.createElement('canvas');c.width=W;c.height=W;var x=c.getContext('2d');
  var F='-apple-system,"Thonburi","Sarabun",sans-serif';
  x.fillStyle='#101820';x.fillRect(0,0,W,W);
  var r=36;x.fillStyle='#b3141c';x.beginPath();
  x.moveTo(60+r,60);x.arcTo(W-60,60,W-60,W-60,r);x.arcTo(W-60,W-60,60,W-60,r);x.arcTo(60,W-60,60,60,r);x.arcTo(60,60,W-60,60,r);x.closePath();x.fill();
  x.strokeStyle='#fff';x.lineWidth=6;x.stroke();
  var pts=(p.pts&&p.pts.length)?p.pts:String(p.body||'').split('\n').map(function(t){return t.replace(/^[•\s]+/,'')}).filter(String).slice(0,3);
  var maxW=W-240,fh=96,fp=50,hl,pl,hh,total;
  for(;;){
    x.font='800 '+fh+'px '+F;hl=wrapTh(x,p.hook,maxW);
    x.font='600 '+fp+'px '+F;pl=pts.map(function(t){return wrapTh(x,'• '+t,maxW-10)});
    hh=hl.length*fh*1.3;
    total=hh+40+pl.reduce(function(a,l){return a+l.length*fp*1.4+14},0);
    if(total<=700||(fh<=56&&fp<=34))break;
    if(fh>56)fh-=6;if(fp>34)fp-=2;
  }
  var y=130;x.textBaseline='top';
  x.fillStyle='#ffe14d';x.font='800 '+fh+'px '+F;
  hl.forEach(function(l,i){x.fillText(l,120,y+i*fh*1.3)});
  y+=hh+40;x.fillStyle='#fff';x.font='600 '+fp+'px '+F;
  pl.forEach(function(ls){ls.forEach(function(l,i){x.fillText(l,120+(i?36:0),y);y+=fp*1.4});y+=14});
  x.fillStyle='#ffd0d0';x.font='500 32px '+F;
  var src=p.src?'ที่มา: '+p.src:'';
  while(src.length>8&&x.measureText(src).width>W-240)src=src.slice(0,-2);
  if(src)x.fillText(src,120,W-170);
  x.fillText('ส่งข่าว · ลุงเล่า',120,W-120);
  return c.toDataURL('image/png');
}
// ปกคลิปแนวตั้ง 9:16 สไตล์ข่าวไวรัล: ป้าย + คำหลักตัวยักษ์ + แถบสิ่งที่เกิด + ตัวเลขเด่น + แถบล่าง · เว้นล่าง ~38% ไว้วางคนเล่าใน CapCut
function postImgCover(p){
  var W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
  var F='-apple-system,"Thonburi","Sarabun",sans-serif';
  var alert=p.cat==='alert';
  var g=x.createLinearGradient(0,0,0,H);
  if(alert){g.addColorStop(0,'#3a0508');g.addColorStop(.55,'#7a0d14');g.addColorStop(1,'#1c0204')}
  else{g.addColorStop(0,'#071c4d');g.addColorStop(.55,'#0f3a9e');g.addColorStop(1,'#04102e')}
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // แสงฟุ้งกลางภาพ
  var rg=x.createRadialGradient(W/2,620,40,W/2,620,700);rg.addColorStop(0,'rgba(255,255,255,.18)');rg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=rg;x.fillRect(0,0,W,H);
  x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';
  function fit(t,w,max,min){var z=max;for(;z>min;z-=4){x.font='900 '+z+'px '+F;if(x.measureText(t).width<=w)break}return z}
  function txt(t,cx,cy,size,fill,stroke,sw){x.font='900 '+size+'px '+F;if(stroke){x.strokeStyle=stroke;x.lineWidth=sw;x.strokeText(t,cx,cy)}x.fillStyle=fill;x.fillText(t,cx,cy)}
  function band(cx,cy,w,h,col,rot){x.save();x.translate(cx,cy);x.rotate(rot);x.fillStyle=col;x.beginPath();x.moveTo(-w/2+18,-h/2);x.lineTo(w/2,-h/2);x.lineTo(w/2-18,h/2);x.lineTo(-w/2,h/2);x.closePath();x.fill();x.restore()}
  function lines(t,w,size){x.font='900 '+size+'px '+F;return wrapTh(x,t,w)}
  var y=190;
  // ป้าย (ข่าวดี/เตือน!)
  if(p.label){var ls=fit(p.label,620,150,80);x.font='900 '+ls+'px '+F;var lw=x.measureText(p.label).width+90;
    band(W/2,y,lw,ls*1.35,alert?'#ffd400':'#e3131b',-0.05);
    x.save();x.translate(W/2,y);x.rotate(-0.05);txt(p.label,0,6,ls,alert?'#b0000b':'#fff','rgba(0,0,0,.25)',6);x.restore();
    y+=ls*0.75+40}

  cunsafe:function(id){delete S.csafe[id];LS.set('sk_csafe',S.csafe);render(true);toast('กลับไปใช้บทเดิมแล้ว')},
  csheet:function(id,btn){clip(sheetPrompt()).then(function(){toast('คัดลอกแล้ว แนบภาพลุงปัจจุบัน แล้ววางใน Gemini')}).catch(function(){toast('คัดลอกไม่ได้')})},
  coutfit:function(id,btn){var c=btn.getAttribute('data-c');clip(outfitPrompt(c)).then(function(){toast('คัดลอกชุด'+(OUTFIT[c]||OUTFIT.th)[0]+'แล้ว แนบภาพลุงปัจจุบัน แล้ววางใน Gemini')}).catch(function(){toast('คัดลอกไม่ได้')})},
  cclip:function(id,btn){var it=find(id);if(!it||!it.lung)return;var segs=vidSegs(clipText(it)),i=+btn.getAttribute('data-i');
    clip(vidClipPrompt(it,i,segs)).then(function(){btn.textContent='คัดลอกแล้ว ✓';btn.style.opacity='.6'}).catch(function(){toast('คัดลอกไม่ได้')})},
  delSave:function(id){
    if(S.delArm!==id){S.delArm=id;render(true);return}
    S.saved=S.saved.filter(function(x){return x.id!==id});S.delArm='';LS.set('sk_saved',S.saved);render(true);toast('ลบแล้ว');
  },
  delDone:function(){
    if(S.delArm!=='__done'){S.delArm='__done';render(true);return}
    S.saved=S.saved.filter(function(x){return x.status!=='done'});S.delArm='';LS.set('sk_saved',S.saved);render(true);toast('ลบข่าวที่โพสต์แล้วเรียบร้อย');
  },
  cimg2:function(id,btn){var p=S.post[id];if(!p||!p.head)return;clip(imgStoryPromptOf(p)).then(function(){
    toast(p.person?'คัดลอกแล้ว แนบรูป '+p.person+' จากเว็บทางการ/แถลงข่าว ไปพร้อมคำสั่งด้วย':'คัดลอกแล้ว ไปวางใน Gemini/ChatGPT');
  }).catch(function(){toast('คัดลอกไม่ได้')})},
  cimg:function(id,btn){var p=S.post[id];if(!p||!p.head)return;clip(imgPromptOf(p)).then(function(){btn.textContent='คัดลอกแล้ว ✓ ไปวางใน Gemini/ChatGPT';setTimeout(function(){btn.textContent='คัดลอกคำสั่งสร้างภาพ'},2500)}).catch(function(){toast('คัดลอกไม่ได้')})},
  cpost:function(id,btn){var p=S.post[id];if(!p)return;clip(postText(p)).then(function(){btn.textContent='คัดลอกแล้ว ✓';setTimeout(function(){btn.textContent='คัดลอกโพสต์'},1500)},function(){toast('คัดลอกไม่ได้ ลองกดค้างที่ข้อความ')})},
  ask:function(id){var it=find(id);if(!it)return;S.ctx={id:id,title:it.title_th||it.title};S.chatErr='';go('chat')},
  copy:function(id,btn){
    var it=find(id);if(!it)return;
    var t=(it.lung||it.title_th||it.title)+'\n\n(ที่มา: '+(it.source||'-')+(it.url?' '+it.url:'')+')';
    clip(t).then(function(){btn.textContent='คัดลอกแล้ว ✓';setTimeout(function(){btn.textContent='คัดลอก'},1500)},function(){toast('คัดลอกไม่ได้ ลองกดค้างที่ข้อความ')});
  },
  save:function(id){
    var i=-1;S.saved.forEach(function(x,k){if(x.id===id)i=k});
    if(i>=0)S.saved.splice(i,1);
    else{
      var it=find(id);
      if(it){
        var copy = JSON.parse(JSON.stringify(it));
        copy.status = 'todo';
        copy.note = '';
        S.saved.unshift(copy);
      }
    }
    LS.set('sk_saved',S.saved);render(true);
  },
  updSave:function(id, field, val){
    S.saved.forEach(function(x){ if(x.id===id) x[field]=val; });
    LS.set('sk_saved',S.saved);
  },
  fetchRe:function(){ loadRealEstate(); },
  fetchPg:function(){ loadPage(); },
  cat:function(id){S.cat=id;LS.set('sk_cat',id);render();var b=document.querySelector('.cat.on');if(b&&b.scrollIntoView)b.scrollIntoView({inline:'center',block:'nearest'})},
  size:function(){
    var total = 0;
    for(var k in localStorage){
      if(localStorage.hasOwnProperty(k)){
        total += (localStorage[k].length + k.length) * 2;
      }
    }
    var mb = (total / (1024*1024)).toFixed(2);
    $('#sizeOut').innerHTML = 'ใช้พื้นที่ไปทั้งหมด <b>'+mb+' MB</b> (สูงสุด 5 MB)<br>ถ้าใกล้เต็ม แนะนำให้ล้างแชทหรือข่าวที่เก็บไว้';
  },
  hist:function(){
    var keys = Object.keys(S.post);
    if(!keys.length){ toast('ยังไม่มีประวัติการสร้างโพสต์'); return; }
    var txt = 'ประวัติโพสต์ล่าสุด:\n\n';
    keys.slice(-10).reverse().forEach(function(k){
      txt += '- ' + S.post[k].hook + '\n';
    });
    txt += '\n(ดูทั้งหมดได้ใน Console)';
    alert(txt);
  },
  go:function(id){go(id)},
  chip:function(id){send(id)},
  clrctx:function(){S.ctx=null;render()},
  clrchat:function(){S.chat=[];S.chatErr='';LS.set('sk_chat',[]);render()},
  test:async function(){
    saveCfg();S.tst={t:'กำลังทดสอบ…',c:''};render(true);
    try{await api('ping',[],30000);S.tst={t:'เชื่อมต่อได้ ✓ โหลดข่าวให้แล้ว ดูที่แท็บข่าว',c:'var(--ok)'};loadNews()}
    catch(e){S.tst={t:e.message,c:'var(--bad)'}}
    render(true);
  },
  wipe:function(){
    if(!S.wipeArm){S.wipeArm=true;render(true);return}
    ['sk_news','sk_saved','sk_chat','sk_tab','sk_re','sk_reUrl','sk_pg'].forEach(function(k){try{localStorage.removeItem(k)}catch(e){}});
    S.news={near:[],th:[],world:[],at:0};S.saved=[];S.chat=[];S.re=[];S.pg=[];S.ctx=null;S.wipeArm=false;render();toast('ล้างแล้ว (รหัส API ยังอยู่)');
  }
};
function saveCfg(){
  var u=$('#cu'),k=$('#ck');
  if(u&&k)LS.set('sk_cfg',{url:u.value.trim(),key:k.value.trim()});
}

$('#page').addEventListener('click',function(e){
  var a=e.target.closest('[data-act]');
  if(!a)return;
  var f=ACT[a.getAttribute('data-act')];
  if(f)f(a.getAttribute('data-id'),a);
});
$('#page').addEventListener('change',function(e){
  if(e.target.id==='cu'||e.target.id==='ck') saveCfg();
  if(e.target.id==='pgUrl'){ S.pgUrl=e.target.value; LS.set('sk_pgUrl',S.pgUrl); }
  if(e.target.id==='vgreen'){ S.vgreen=e.target.checked; LS.set('sk_vgreen',S.vgreen); toast(S.vgreen?'คลิปจะคงฉากเขียวไว้':'คลิปจะใช้ฉากตามภาพลุง'); }
  if(e.target.id==='vchar'){ S.vchar=e.target.value.trim(); LS.set('sk_vchar',S.vchar); toast('บันทึกตัวละครแล้ว'); }
  if(e.target.id==='reUrl') { S.reUrl = e.target.value; LS.set('sk_reUrl', S.reUrl); }
  var act = e.target.getAttribute('data-act');
  if(act==='status' || act==='note'){
    ACT.updSave(e.target.getAttribute('data-id'), act, e.target.value);
  }
});
$('#page').addEventListener('input',function(e){
  var act = e.target.getAttribute('data-act');
  if(act==='note'){
    ACT.updSave(e.target.getAttribute('data-id'), act, e.target.value);
  }
});
Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(b){b.addEventListener('click',function(){S.wipeArm=false;go(b.getAttribute('data-tab'))})});
$('#rf').addEventListener('click',function(){loadNews()});
$('#snd').addEventListener('click',function(){send($('#msg').value)});
$('#msg').addEventListener('input',grow);

function hash(t){var h=5381;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return String(h)}
async function checkUpdate(){
  var ae=document.activeElement;
  if(S.busy||S.sending||S.loading||(ae&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&ae.value))return;
  try{
    var r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    var h=hash(await r.text()),prev=LS.get('sk_hash',null);
    LS.set('sk_hash',h);
    if(prev&&prev!==h)location.reload();
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  checkUpdate();
  if(Date.now()-(S.news.at||0)>10*60*1000)loadNews();
});

render();
checkUpdate();
if(Date.now()-(S.news.at||0)>10*60*1000)loadNews();
})();
</script>
</body>
</html>
